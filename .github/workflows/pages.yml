name: Deploy Risk V1 Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dashboard
        run: |
          node --check assets/app.js
          npm install --no-save --ignore-scripts jsdom@25.0.1 >/dev/null
          node tests/dashboard_smoke.mjs
          python -m json.tool data/summary.json >/dev/null
          python -m json.tool data/strategy_spec.json >/dev/null
          python -m json.tool data/forward_status.json >/dev/null
          python -m json.tool data/account_state.json >/dev/null
          python -m json.tool data/version_registry.json >/dev/null
          python -m json.tool data/capital_audit_metrics.json >/dev/null
          test -f index.html
          test -f data/risk_daily_mtm.csv
          test -f data/treasury_daily_nav.csv
          test -f data/trades_308.csv
          test -f data/execution_variants_daily.csv
          test -f data/legacy_monthly_cumulative_pct.csv
          test -f data/capital_marginal_curve.csv
          test -f data/capital_annual_performance.csv
          test -f data/crisis_windows.csv
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
