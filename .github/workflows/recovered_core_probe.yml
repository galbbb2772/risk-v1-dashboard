name: Risk Dashboard Recovered Core Probe

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/app.js"
      - "data/recovered_core_*"
      - "tests/dashboard_smoke.mjs"
      - "tests/dashboard_browser.mjs"
      - "PROBE_TRIGGER.md"
      - ".github/workflows/recovered_core_probe.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and data
        run: |
          node --check assets/app.js
          python -m json.tool data/recovered_core_status.json >/dev/null
          python -m json.tool data/recovered_core_manifest.json >/dev/null
          test -f data/recovered_core_account_summary.csv
          test -f data/recovered_core_daily.csv
          test -f data/recovered_core_trades.csv
          test -f data/recovered_core_signals.csv
      - name: Run jsdom smoke
        run: |
          npm install --no-save --ignore-scripts jsdom@25.0.1 puppeteer-core@24.31.0 >/dev/null
          node tests/dashboard_smoke.mjs
      - name: Run real Chrome smoke
        run: |
          CHROME_BIN="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_BIN"
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/risk_dashboard_probe_http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/dashboard_browser.mjs
